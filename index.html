    function HCF(a, b, c) {



        for (let h = 100; h > 1; h--) {

          if (a % h == 0 && b % h == 0 && c % h == 0) {
            hcf.push(h)

            break
          }
        } // for loop

        return hcf

    function CSqr(a, b, c) {

    let n1 = b**2*a  - 4*a*a*c  //n1 and d1 rep. the numerator and denominator of the fraction within the root
      let d1 = 4 * a ** 3
      let n2 = b              //n2 and d2 rep. the numerator and denominator of the constant that's added to the root 
      let d2 = 2 * a

      let n3 = 4 * a**2 *c  - b*b*a//n3 and d3 rep. the numerator and denominator of c  in (a(x+b) + c) 
      let d3 = 4 * a **2
      //console.log( 'zuiry' + a)






       FrSimp(n1,d1)
      n1 /= Frsimp[0]
      d1 /= Frsimp[0]
      FrSimp(n2,d2)

      n2 /= Frsimp[1]
      d2 /= Frsimp[1]

      FrSimp(n3,d3)
      n3 /= Frsimp[2]
      d3 /= Frsimp[2]


      surds.push(n1, d1, n2, d2, n3, d3) 
     
    }







   


    function FrQF(a, b, c) {

      // console.log( 'using positive root ' )
      for (let n = 1; n < 100; n++) {                 //looops numerator from 1 to 100 

        for (let d = 1; d < 100; d++) {                //loops denominator from 1 to 100 
          let N = a*(n)*(n) + b * (n*d) + c * d * d
          let D =  a* a
          if (N/D == 0) {
          //  console.log(n + " " + d)

           //  console.log('answer is' + 18 * (-11/9)^2  + 87 * (-11/9) + 77)
            if (n/d != arr4[arr4.length - 2] / arr4[arr4.length - 1]) {
              arr4.push(n, d)
            }

          }

        }
      }

     //console.log( 'using negative root ' )
      for (let n = 1; n > -100; n--) {                 //looops numerator from 1 to -100 *in terms of decreasing value*

        for (let d = 1; d < 100; d++) {                //loops denominator from 1 to 100 

          if(n/d == arr1[0]){continue }
          let N = a*(n)*(n) + b * (n*d) + c * d * d
          let D =  a* a

          if (N/D == 0) {
           // console.log(n + " " + d)


            if (n/d != arr4[arr4.length - 2] / arr4[arr4.length - 1]) {

              arr4.push(n, d)
            }

          }

        }
      }



      return 'The fractional roots are ' + arr4[0] + ' ' + arr4[1] + ' and ' + arr4[2] + '  ' + arr4[3]

    }

   

    function FrSimp(a,b){
      for (let h = 1000; h > 0; h--) {

        if (a % h == 0 && b % h == 0) {
          Frsimp.push(h)
          break
        }
      } // for loop
      //return 'The simplified fraction is ' + a/Frsimp[0] + " " + b/Frsimp[0]
        return "Simplification completed" //(a/Frsimp[0]) / b/Frsimp[0]
    }
