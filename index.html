    function hcf2(a,b){
   for(i = b;i>1;i--){
     if(a % i == 0 && b % i == 0){
       return i
       break
     }
   }
    }



    function hcf3(a,b,c){
   for(e = b;e>1;e--){
     if(a % e == 0 && b % e == 0 && c % e == 0){
       return e
       break
     }
   }
    }
    



    

    function decimalToFraction(x){
   
    let tolerance = 1.0E-6;
    let denominator = 1;

    while(Math.abs(Math.round(x * denominator) - x * denominator) > tolerance){
        denominator++;
    }

    let numerator = Math.round(x * denominator);

    let g = hcf2(numerator,denominator);
 if( Boolean( hcf2(numerator,denominator) ) == true ){
    return {
        num: numerator/g,
        den: denominator/g
    }
  }else{
      return{
      num: numerator,
        den: denominator}
    }
}


    function simplifySqrt(n) {
    let outside = 1;
    let inside = n;

    for (let i = 2; i * i <= inside; i++) {
        while (inside % (i * i) === 0) {
            inside /= i * i;
            outside *= i;
        }
    }

    return {outside: outside, inside: inside};
}
