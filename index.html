  <script>

    function fadeIn(){
      document.getElementById("answerbox").classList.add("show");
    }

    function gcd(a,b){
    while(b != 0){
        let temp = b;
        b = a % b;
        a = temp;
    }
    return a;
}

    function decimalToFraction(x){

    let tolerance = 1.0E-6;
    let denominator = 1;

    while(Math.abs(Math.round(x * denominator) - x * denominator) > tolerance){
        denominator++;
    }

    let numerator = Math.round(x * denominator);

    let g = gcd(numerator,denominator);

    return {
        num: numerator/g,
        den: denominator/g
    };
}


    function simplifySqrt(n) {
    let outside = 1;
    let inside = n;

    for (let i = 2; i * i <= inside; i++) {
        while (inside % (i * i) === 0) {
            inside /= i * i;
            outside *= i;
        }
    }

    return {outside: outside, inside: inside};
}


function Factorise(){
     let a = document.getElementById("a").value
      let b = document.getElementById("b").value
      let c = document.getElementById("c").value
  

       factorQuadratic(a,b,c)
    }




function factorQuadratic(a, b, c) {

    // Calculate discriminant
    let discriminant = b*b - 4*a*c;

    // Check if real roots exist
    if (discriminant < 0) {
        var answer = "The quadratic has no real roots." 
        var answer2 = "The quadratic has no real roots." 
        document.getElementById("result").innerHTML = answer
        document.getElementById("result2").innerHTML = answer2
        return;
    }
    
   let sqrt = Math.sqrt(discriminant) 
   
   if(Number.isInteger(sqrt)){
    let root1 = (-b + Math.sqrt(discriminant)) / (2*a);
    let root2 = (-b - Math.sqrt(discriminant)) / (2*a);

       
          root1 *= -1    
          root2 *= -1 
                  
    let f1 = decimalToFraction(root1);
    let f2 = decimalToFraction(root2);


    NewRoot1 =  f1.num + "/" + f1.den
    NewRoot2 = f2.num + "/" + f2.den
    var answer2 = "1st Root: " + f1.num + "/" + f1.den + "<br>" + "2nd Root: " + f2.num + "/" + f2.den
    document.getElementById("result2").innerHTML = answer2


    // Show factorised form
    if(root1 != root2){

    var answer = "Factorised Form: " + a + "(x + " + f1.num + "/" + f1.den + ")(x + " +f2.num + "/" + f2.den + ")";
        document.getElementById("result").innerHTML = answer

  } else {
  var answer = "Factorised Form: " + a + "(x + " + NewRoot1 + ")^2"
  document.getElementById("result").innerHTML = answer
}
}





else{ //If sqrt is non-integer
        let simplified = simplifySqrt(discriminant);

        let outside = simplified.outside;
        let inside = simplified.inside;
        b *= -1
      
        
        if ( b && outside % (2*a) !==0){
             root1 = '(' + b + " + " + outside + "√" + inside + ")/" + (2*a)
             root2 = '(' + b + " - " + outside + "√" + inside + ")/" + (2*a)
             var answer2 = "1st Root: " + root1 + " <br>" + "2nd Root: " + root2
             document.getElementById("result2").innerHTML = answer2;
          
             var answer = "Factorised Form: " + a + "(x - (" + b + " + " + outside + 
             "√" + inside + ")/" + (2*a) + ")" +
             "(x - (" + b + " - " + outside + "√" + inside + ")/" + (2*a) + ")";
              document.getElementById("result").innerHTML = answer;
       }else{
             outside /= (2*a)
             b /= (2*a)


             root1 =  b + " + " + outside + "√" + inside 
             root2 = b + " - " + outside + "√" + inside 
             var answer2 = "1st Root: " + root1 + " <br>" + "2nd Root: " + root2
             document.getElementById("result2").innerHTML = answer2;
    
              var answer = a + "(x - (" + b + " + " + outside + 
              "√" + inside + ")" + "(x - (" + b + " - " + outside + "√" + inside + ")";
             document.getElementById("result").innerHTML = answer;
                }
    
      }
}
